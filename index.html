<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1c">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Proview Jobs</title>
<link rel="icon" type="image/svg+xml" href="icon-app.svg">
<link rel="apple-touch-icon" href="icon-app.svg">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1c;--card:#141a2b;--card2:#1b2238;--line:#263050;--ink:#f3f5fb;--mut:#94a0bd;--main:#f59e0b;--main2:#ea7a0c;--pri:#fbbf5a;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--info:#7aa7ff;--onpri:#1a1205;--navh:64px;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15}
h2{margin:0 0 10px;font-size:16px;font-weight:700}
p{margin:0 0 8px}
small,.mut{color:var(--mut)}
[hidden]{display:none!important}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.app{min-height:100%;display:flex;flex-direction:column}
/* top bar: large title, like a phone app */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:calc(10px + var(--sat)) 16px 10px;background:rgba(10,15,28,.86);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.top .pvlogo{width:38px;height:38px}
.top .tt{flex:1;min-width:0}
.top .tt small{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--main),var(--main2));color:var(--onpri);font-weight:700;font-size:16px;display:grid;place-items:center;flex:none}
.avatar.big{width:64px;height:64px;font-size:26px}
.avatar.sm{width:24px;height:24px;font-size:11.5px}
.avatar.none{background:var(--card2);color:var(--mut);box-shadow:inset 0 0 0 1.5px var(--line)}
.content{flex:1;width:100%;max-width:760px;margin:0 auto;padding:6px 14px calc(var(--navh) + var(--sab) + 44px)}
/* bottom tab bar */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--navh) + var(--sab));padding:0 6px var(--sab);display:flex;align-items:stretch;justify-content:space-around;background:rgba(16,21,37,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav button{flex:1;max-width:120px;border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;position:relative}
.nav button.on{color:var(--pri)}
.nav button.on:before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--main)}
.nav .fab{flex:0 0 58px;height:58px;margin-top:-20px;border-radius:50%;background:linear-gradient(135deg,var(--main),var(--main2));color:var(--onpri);box-shadow:0 10px 24px -6px rgba(245,158,11,.6),0 0 0 6px var(--bg);align-self:flex-start}
.nav .fab .ic{width:28px;height:28px;stroke-width:2.4}
.nav button:active,.job:active,.stat:active,.person:active{transform:scale(.97)}
/* stat tiles double as filters */
.stats{display:grid;gap:8px;margin:6px 0 16px}
.stats.n4{grid-template-columns:repeat(4,1fr)}.stats.n3{grid-template-columns:repeat(3,1fr)}
.stat{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:11px 6px 9px;text-align:center;min-width:0;transition:transform .12s}
.stat b{display:block;font-size:24px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11.5px;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat.on{background:linear-gradient(160deg,rgba(245,158,11,.22),rgba(245,158,11,.06));border-color:var(--main)}
.stat.on span{color:var(--pri)}
.stat.k-late b{color:var(--bad)}.stat.k-done b{color:var(--ok)}.stat.k-unassigned b{color:var(--warn)}
.stat.zero b{color:var(--mut)}
.lh{display:flex;align-items:center;gap:6px;margin:0 2px 10px}
.lh h2{margin:0 auto 0 0;font-size:17px}
.lh h2 small{font-weight:600;font-size:14px;margin-left:4px}
.lnk{border:0;background:var(--card2);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.lnk .ic{width:15px;height:15px;color:var(--pri)}
.search{width:100%;height:44px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:var(--card);font-size:16px;margin-bottom:12px}
.search::placeholder{color:var(--mut)}
.grp{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:16px 4px 8px;display:flex;align-items:center;gap:8px}
.grp:first-child{margin-top:2px}
.grp.late{color:var(--bad)}
.grp i{font-style:normal;background:var(--card2);border-radius:999px;padding:1px 8px;letter-spacing:0;color:var(--ink)}
.list{display:grid;gap:10px}
.job{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 14px 12px 18px;position:relative;overflow:hidden;transition:transform .12s}
.job:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--line)}
.job.p-urgent:before{background:var(--bad)}.job.p-high:before{background:var(--warn)}.job.p-normal:before{background:var(--info)}
.job.s-done,.job.s-cancelled{opacity:.62}
.job .r1,.pnl .r1{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.ref{font-size:12.5px;font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.job .t{display:block;font-size:16.5px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.job .m{display:block;color:var(--mut);font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}
.job .f{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:11px;font-size:13px;color:var(--mut)}
.job .f>span{display:inline-flex;align-items:center;gap:6px}
.job .f b{color:var(--ink);font-weight:600}
.job .f .ic{width:15px;height:15px}
.job .bar{flex:1 1 60px;min-width:50px;max-width:110px;height:5px;border-radius:9px;background:var(--card2);overflow:hidden}
.job .bar i{display:block;height:100%;background:var(--ok)}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--card2);color:var(--ink)}
.pill.urgent{background:rgba(251,113,133,.16);color:var(--bad)}.pill.high{background:rgba(251,191,36,.15);color:var(--warn)}.pill.low{color:var(--mut)}
.pill.open{background:rgba(122,167,255,.15);color:var(--info)}.pill.in_progress{background:rgba(245,158,11,.17);color:var(--pri)}.pill.done{background:rgba(52,211,153,.15);color:var(--ok)}.pill.cancelled{color:var(--mut)}
.pill.wa{background:rgba(37,211,102,.14);color:#4ade80}.pill.un{background:rgba(251,191,36,.15);color:var(--warn)}
.late{color:var(--bad)!important;font-weight:700}
.empty{text-align:center;color:var(--mut);padding:46px 18px;background:var(--card);border:1px dashed var(--line);border-radius:18px}
.empty .ic{width:42px;height:42px;color:var(--line);margin-bottom:8px;stroke-width:1.5}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card h2{display:flex;align-items:center;gap:8px}
.card h2 small{font-weight:600;font-size:13px}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:14px;padding:10px 16px;font-weight:700;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;color:var(--ink)}
.btn.pri{background:linear-gradient(135deg,var(--main),var(--main2));border-color:transparent;color:var(--onpri)}
.btn.ok{background:var(--ok);border-color:transparent;color:#04281a}
.btn.bad{color:var(--bad);border-color:rgba(251,113,133,.5);background:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:11px}
.btn.wide{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.ibtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--card2);color:var(--ink);display:grid;place-items:center;flex:none;text-decoration:none}
/* job page: slides in over the list, actions pinned to the bottom */
.pnl{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;animation:slidein .22s ease-out}
@keyframes slidein{from{transform:translateX(28px);opacity:0}}
.pnl-in{max-width:760px;margin:0 auto;padding:0 14px calc(110px + var(--sab))}
.pnl-hd{position:sticky;top:0;z-index:2;background:rgba(10,15,28,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;align-items:center;gap:10px;padding:calc(10px + var(--sat)) 0 10px;margin-bottom:8px}
.pnl-hd .ref{font-size:15px;margin-right:auto;color:var(--ink)}
.pnl h1{font-size:24px;line-height:1.22;margin:4px 0 14px;overflow-wrap:anywhere}
.quick{display:flex;gap:8px;margin-bottom:12px}
.quick a{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:700;text-decoration:none}
.quick a .ic{color:var(--pri);width:19px;height:19px}
.kv{display:grid;grid-template-columns:100px 1fr;gap:12px 10px;margin:0;align-items:center}
.kv dt{color:var(--mut);font-size:13.5px}
.kv dd{margin:0;overflow-wrap:anywhere}
.kv a{color:var(--pri);font-weight:600}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.pnl-bar{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:12px 14px calc(12px + var(--sab));background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;justify-content:center}
.pnl-bar .btn{flex:1;max-width:366px;min-height:52px;font-size:16px;border-radius:16px;box-shadow:0 10px 26px -10px rgba(0,0,0,.8)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.acts .btn{flex:1 1 150px}
.ck{display:flex;align-items:flex-start;gap:12px;padding:12px 2px;border-top:1px solid var(--line);cursor:pointer}
.ck:first-of-type{border-top:0}
.ck input{width:24px;height:24px;margin:0;accent-color:var(--ok);flex:none}
.ck span{flex:1;overflow-wrap:anywhere}
.ck input:checked+span{color:var(--mut);text-decoration:line-through}
.ck .q{flex:none;font-weight:700;font-variant-numeric:tabular-nums;color:var(--pri);text-decoration:none!important;background:var(--card2);border-radius:8px;padding:1px 8px}
.prog{height:6px;border-radius:99px;background:var(--card2);overflow:hidden;margin:2px 0 8px}
.prog i{display:block;height:100%;background:var(--ok);transition:width .25s}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:10px}
.photos a{display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--card2);position:relative}
.photos img{width:100%;height:100%;object-fit:cover;display:block}
.photos .rm{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:16px;line-height:1}
/* sheets: forms and confirmations rise from the bottom */
.mdl{position:fixed;inset:0;z-index:60;background:rgba(3,6,14,.66);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
@keyframes fade{from{opacity:0}}
.mdl-box{background:var(--card);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + var(--sab));border:1px solid var(--line);border-bottom:0;animation:rise .24s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(40px);opacity:.4}}
.mdl-box:before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
@media(min-width:700px){.mdl{align-items:center;padding:20px}.mdl-box{border-radius:24px;border-bottom:1px solid var(--line)}.mdl-box:before{display:none}.mdl-box{padding-top:20px}}
@media(prefers-reduced-motion:reduce){.pnl,.mdl,.mdl-box{animation:none}}
.mdl-box h2{font-size:20px;margin-bottom:12px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:12px}
.fld input,.fld select,.fld textarea,.in{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#0e1424;color:var(--ink);font-size:16px;font-weight:400;width:100%;min-height:46px}
.fld textarea{min-height:88px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:460px){.two{grid-template-columns:1fr}}
.rows{display:grid;gap:6px;margin-bottom:6px}
.rw{display:flex;gap:6px}
.rw .in{flex:1;min-width:0}
.rw .qty{flex:0 0 70px;text-align:center}
.rw .x{flex:none;width:46px;border:1px solid var(--line);background:none;border-radius:12px;font-size:18px;color:var(--mut)}
.sect{font-size:12px;font-weight:700;color:var(--mut);margin:16px 0 8px;text-transform:uppercase;letter-spacing:.08em}
.foot{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.foot .btn{flex:1}
.foot .sp{flex:0 0 auto}
.err{background:rgba(251,113,133,.14);color:#ffb1bd;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.note{background:rgba(122,167,255,.12);color:#b7ccff;border-radius:14px;padding:11px 13px;font-size:14px;margin-bottom:12px}
.person{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;transition:transform .12s}
.person .nm{flex:1;min-width:0}
.person .nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .nm small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me{text-align:center;padding:26px 16px}
.me .avatar{margin:0 auto 12px}
.me b{display:block;font-size:20px}
pre.code{background:#0e1424;border:1px solid var(--line);border-radius:12px;padding:12px;font:13.5px/1.55 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 10px}
.copy{display:flex;gap:6px;align-items:stretch;margin-bottom:10px}
.copy code{flex:1;min-width:0;background:#0e1424;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow-wrap:anywhere}
.log{border-top:1px solid var(--line);padding:10px 0}
.log:first-of-type{border-top:0}
.log .h{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:13px;color:var(--mut);margin-bottom:3px}
.log .h b{color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(var(--navh) + var(--sab) + 28px);transform:translateX(-50%);z-index:90;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
#toast div{background:#f3f5fb;color:#0a0f1c;padding:12px 14px;border-radius:14px;font-weight:700;font-size:14px;box-shadow:0 14px 34px rgba(0,0,0,.55);text-align:center;animation:rise .2s}
#toast div.bad{background:#e11d48;color:#fff}
/* wide screens: the tab bar becomes a side rail */
@media(min-width:900px){
  .nav{top:0;right:auto;bottom:0;width:92px;height:auto;flex-direction:column;justify-content:flex-start;gap:6px;padding:18px 8px;border-top:0;border-right:1px solid var(--line)}
  .nav button{flex:0 0 64px;max-width:none;border-radius:14px}
  .nav button.on:before{top:18px;left:-8px;width:3px;height:28px;border-radius:0 3px 3px 0}
  .nav .fab{order:-1;margin:0 auto 14px;flex:0 0 58px;align-self:center;box-shadow:0 10px 24px -6px rgba(245,158,11,.6)}
  .app{padding-left:92px}.content{padding-bottom:60px}
  .pnl{left:92px}.pnl-bar{left:92px}
  #toast{bottom:28px}
}
/* ===== Proview shell: the same logo, sign-in page and loading page as the other Proview sites ===== */

/* sign-in page */
.login.pvs-root>.pvs-auth{width:100%;max-width:none;margin:0}
.pvs-auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100%}
.pvs-auth.solo{grid-template-columns:1fr}
.pvs-art{background:#141418;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;min-height:100vh}
.pvs-brand{display:flex;align-items:center;gap:10px}
.pvs-art h2{font-size:clamp(30px,3.2vw,40px);line-height:1.05;max-width:400px;letter-spacing:-.03em;margin:0;font-weight:700;position:relative;z-index:1}
.pvs-art .sub{color:#9a9aa4;max-width:300px;font-size:15px;line-height:1.45;position:relative;z-index:1}
.pvs-mock{position:absolute;pointer-events:none;z-index:0;right:-40px;bottom:56px;width:380px;transform:rotate(-5deg);background:#1f1f26;border:1px solid #33333c;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 30px 70px rgba(0,0,0,.45);color:#fff}
.pvs-mock .hd{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.pvs-mock .hd span{font-size:11px;color:#9a9aa4}
.pvs-mock .rw{display:flex;align-items:center;gap:10px;background:#18181d;border:1px solid #2c2c34;border-radius:10px;padding:9px 11px;font-size:12px}
.pvs-mock .rw b{font-size:12.5px;min-width:40px}
.pvs-mock .rw em{font-style:normal;color:#c9c9d1;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvs-mock .rw span{font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pvs-mock .s{background:linear-gradient(90deg,#62b0ec,#8b88dc);color:#fff}
.pvs-mock .r{background:rgba(98,176,236,.12);color:#9fd0f5;box-shadow:inset 0 0 0 1.5px #62b0ec}
.pvs-mock .f{color:#77777f;box-shadow:inset 0 0 0 1.5px #4a4a54}
.pvs-form{display:grid;place-items:center;padding:32px 20px}
.pvs-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:34px 32px;width:min(440px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(20,20,30,.04),0 18px 50px -18px rgba(20,20,30,.18);margin:0}
.pvs-card.wide{width:min(720px,100%)}
.pvs-card .pvs-brand{gap:12px;margin-bottom:8px}
.pvs-card .pvs-brand .pvlogo{width:60px;height:60px}
.pvs-card .pvs-brand .pvword{font-size:20px;letter-spacing:.14em;color:var(--ink)}
.pvs-card h1{font-size:26px;line-height:1.2;margin:0;letter-spacing:-.02em;font-weight:700;color:var(--ink)}
.pvs-card .muted{color:var(--mut);margin:0;font-size:15px;line-height:1.45}
.pvs-card label.af{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#3d3d46}
.pvs-card label.af input{height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;font-size:15px;font-weight:400;background:#fff;color:var(--ink);width:100%;margin:0}
.pvs-card label.af input:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
.pvs-card .pw-wrap{position:relative}
.pvs-card .pw-wrap input{padding-right:44px}
.pvs-card .pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;color:#8a8a94;cursor:pointer;display:grid;place-items:center;border-radius:8px;padding:0}
.pvs-card .pw-eye:hover{color:var(--ink);background:var(--bg)}
.pvs-card .pw-eye.on{color:var(--pri)}
.pvs-card .go{height:44px;border:0;border-radius:10px;background:linear-gradient(135deg,#2f84d4 0%,#5a5fbb 100%);color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;width:100%}
.pvs-card .go:disabled{opacity:.6;cursor:default}
.pvs-card .or-line{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:13px;margin:2px 0}
.pvs-card .or-line:before,.pvs-card .or-line:after{content:"";flex:1;height:1px;background:var(--line)}
.pvs-card .pv-sso{height:44px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.pvs-card .pv-sso:hover{background:var(--bg)}
.pvs-card .alinks{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pvs-card .alinks button{border:0;background:none;font:inherit;font-weight:600;font-size:13.5px;color:var(--ink);padding:8px 12px;border-radius:8px;cursor:pointer}
.pvs-card .alinks button:hover{background:var(--bg)}
.pvs-card .notice{background:#edf2fd;border:1px solid #cbd8f6;color:#213f8a;padding:10px 14px;border-radius:10px;font-size:14px;line-height:1.4}
.pvs-card .notice.bad{background:#fef0ef;border-color:#f7c6c2;color:#a3231a}
.pvs-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.pvs-pick button{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;text-align:left;padding:13px 14px;cursor:pointer;display:block}
.pvs-pick button:hover{background:var(--bg)}
.pvs-pick button b{display:block;font-size:15px}
.pvs-pick button span{color:var(--mut);font-size:13px}
@media (max-width:1300px) and (min-width:821px){.pvs-mock{width:300px}}
@media (max-width:820px){.pvs-auth{grid-template-columns:1fr}.pvs-art{display:none}.pvs-form{padding:24px 14px;align-content:start;min-height:100vh}.pvs-card{padding:26px 20px;border-radius:18px;margin-top:4vh}.pvs-card label.af input{font-size:16px}.pvs-card .pvs-brand .pvword{font-size:17px}}
@media (max-width:380px){.pvs-card .pvs-brand .pvword{font-size:14px;letter-spacing:.1em}}
.pvs-card .plin{font-size:26px;letter-spacing:.35em;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%;font-family:inherit}
.pvs-card .plin:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:transparent}
/* Proview Jobs runs dark: the shared sign-in and loading pages, recoloured to match. */
.login.pvs-root{--bg:#0a0f1c;--ink:#f3f5fb;--line:#263050;--mut:#94a0bd;--card:#141a2b;--pri:#f59e0b;color-scheme:dark;background:radial-gradient(120% 60% at 50% 0%,#1a2140 0%,#0a0f1c 60%)}
.pvs-card{background:#141a2b;box-shadow:0 30px 80px -20px rgba(0,0,0,.7)}

.pvs-card label.af input{background:#0e1424;color:var(--ink)}

<body>
<div class="app" id="app" hidden><header class="top" id="top"></header><main class="content" id="main"></main><nav class="nav" id="tabs" aria-label="Sections"></nav></div>
<div id="pnl-root"></div><div id="mdl-root"></div>
<div id="login-root"><div class="login pvs-root pvs-wait"><div class="pvs-splash" role="status" aria-label="Loading Proview Jobs"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>

/* ---- 10-core.js ---- */
'use strict';
/* Proview Jobs: helpers, state and data. */
const SDK = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const S = {
  sb: null, cfg: null, me: null, settings: null,
  people: [], jobs: [], wa: [], numbers: [],
  tab: 'jobs', filter: 'open', q: '',
  job: null,          // the job that is open, with its tasks, parts and photos
  ready: false,
};
const isMgr = () => !!S.me && S.me.role === 'manager';

const STATUS = { open: 'To do', in_progress: 'In progress', done: 'Done', cancelled: 'Cancelled' };
const PRIORITY = { low: 'Low', normal: 'Normal', high: 'High', urgent: 'Urgent' };
const PRANK = { urgent: 0, high: 1, normal: 2, low: 3 };

function toast(msg, bad) {
  const d = document.createElement('div');
  d.textContent = msg;
  if (bad) d.className = 'bad';
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), bad ? 6000 : 3200);
}
function problem(e) {
  const m = (e && (e.message || e.error_description || e.error)) || String(e || 'Something went wrong');
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'No connection. Check the internet and try again.';
  return m;
}
function jref(j) { return 'J-' + String(j.ref).padStart(4, '0'); }
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function niceDate(iso) {
  if (!iso) return '';
  const t = todayISO();
  if (iso === t) return 'Today';
  const d = new Date(iso + 'T12:00:00');
  const diff = Math.round((d - new Date(t + 'T12:00:00')) / 86400000);
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  const o = { weekday: 'short', day: 'numeric', month: 'short' };
  if (d.getFullYear() !== new Date().getFullYear()) o.year = 'numeric';
  return d.toLocaleDateString('en-GB', o);
}
function niceTime(ts) {
  if (!ts) return '';
  return new Date(ts).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function isLate(j) { return !!j.due_date && j.due_date < todayISO() && (j.status === 'open' || j.status === 'in_progress'); }
function person(id) { return S.people.find((p) => p.id === id) || null; }
function personName(id) { const p = person(id); return p ? p.name : ''; }
function digits(s) { let d = String(s || '').replace(/\D/g, ''); if (d.startsWith('00')) d = d.slice(2); return d; }
function mapsLink(a) { return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(a); }
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied'); }
  catch (_) { toast('Could not copy. Press and hold the text to copy it.', true); }
}

/* ---------- data ---------- */
async function q(promise) {
  const { data, error } = await promise;
  if (error) throw error;
  return data;
}
async function loadJobs() {
  S.jobs = await q(S.sb.from('pj_jobs').select('*, pj_job_tasks(id,done), pj_job_parts(id,used)').order('created_at', { ascending: false }).limit(1000)) || [];
}
async function loadPeople() {
  S.people = await q(S.sb.from('pj_people').select('*').order('name')) || [];
}
async function loadSettings() {
  const rows = await q(S.sb.from('pj_settings').select('*').limit(1));
  S.settings = (rows && rows[0]) || { timezone: 'Europe/London', business_name: 'Proview Tech' };
}
async function loadWa() {
  S.wa = await q(S.sb.from('pj_wa_log').select('*').order('created_at', { ascending: false }).limit(30)) || [];
}
async function loadNumbers() {
  S.numbers = await q(S.sb.from('pj_wa_numbers').select('*').order('created_at')) || [];
}
/* Ask the server to send WhatsApp job notices. Quietly does nothing until a number is connected. */
function sendNotices(jobId, onlyAssignee) {
  if (!S.sb.functions) return;
  S.sb.functions.invoke('whatsapp-webhook', { body: { job_id: jobId, only_assignee: !!onlyAssignee }, headers: { 'x-pj-notify': '1' } })
    .then(({ data }) => { if (data && data.sent) toast('Sent on WhatsApp to ' + data.sent + (data.sent === 1 ? ' number' : ' numbers')); })
    .catch(() => {});
}
async function loadJob(id) {
  const j = await q(S.sb.from('pj_jobs').select('*, pj_job_tasks(*), pj_job_parts(*), pj_job_photos(*)').eq('id', id).maybeSingle());
  if (!j) return null;
  j.pj_job_tasks = (j.pj_job_tasks || []).sort((a, b) => a.sort - b.sort);
  j.pj_job_parts = (j.pj_job_parts || []).sort((a, b) => a.sort - b.sort);
  j.pj_job_photos = (j.pj_job_photos || []).sort((a, b) => (a.created_at < b.created_at ? -1 : 1));
  if (j.pj_job_photos.length) {
    try {
      const { data } = await S.sb.storage.from('job-photos').createSignedUrls(j.pj_job_photos.map((p) => p.path), 3600);
      (data || []).forEach((s, i) => { if (s && s.signedUrl) j.pj_job_photos[i].url = s.signedUrl; });
    } catch (_) { /* photos simply show as blanks */ }
  }
  return j;
}

/* Shrink a phone photo before sending it: 1600px on the long side is plenty to read a label. */
async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', 0.82));
    if (blob) return blob;
  } catch (_) { /* fall through to the original file */ }
  return file;
}
function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}

/* ---------- dialogs ---------- */
function modal(html) { $('#mdl-root').innerHTML = '<div class="mdl" data-a="mdl-bg"><div class="mdl-box" role="dialog" aria-modal="true">' + html + '</div></div>'; const f = $('#mdl-root [autofocus]'); if (f) f.focus(); }
function closeModal() { $('#mdl-root').innerHTML = ''; S.confirm = null; }
function confirmBox(title, text, yes, fn, bad) {
  S.confirm = fn;
  modal('<h2>' + esc(title) + '</h2><p>' + esc(text) + '</p><div class="foot"><button class="btn" data-a="mdl-close">Cancel</button><button class="btn ' + (bad ? 'bad' : 'pri') + '" data-a="confirm-yes">' + esc(yes) + '</button></div>');
}
function busy(btn, on) { if (btn) btn.disabled = !!on; }

/* ---- 20-auth.js ---- */
/* Sign-in pages (the shared Proview sign-in look). */
const BRAND = '<div class="pvs-brand"><span class="pvlogo"></span><span class="pvword">PROVIEW <i>JOBS</i></span></div>';
function authPage(body) {
  $('#login-root').innerHTML = '<div class="login pvs-root"><div class="pvs-auth solo"><div class="pvs-form"><form class="pvs-card" id="auth-form" novalidate>' + BRAND + body + '</form></div></div></div>';
  $('#app').hidden = true;
  const f = $('#login-root input'); if (f) f.focus();
}
function field(label, name, type, extra) {
  return '<label class="af">' + label + '<input name="' + name + '" type="' + type + '" ' + (extra || '') + '></label>';
}
function authScreen(kind, o) {
  o = o || {};
  S.auth = kind;
  const msg = o.err ? '<div class="notice bad">' + esc(o.err) + '</div>' : (o.note ? '<div class="notice">' + esc(o.note) + '</div>' : '');
  const email = esc(o.email || '');
  if (kind === 'in') return authPage('<h1>Sign in</h1><p class="muted">Jobs for the Proview Tech team.</p>' + msg +
    field('Email', 'email', 'email', 'autocomplete="username" required value="' + email + '"') +
    field('Password', 'password', 'password', 'autocomplete="current-password" required') +
    '<button class="go" type="submit">Sign in</button>' +
    '<div class="alinks"><button type="button" data-a="auth" data-k="up">First time? Create your account</button><button type="button" data-a="auth" data-k="forgot">Forgot password?</button></div>');
  if (kind === 'up') return authPage('<h1>Create your account</h1><p class="muted">Use the email your manager added for you. The first person to sign up becomes the manager.</p>' + msg +
    field('Your name', 'name', 'text', 'autocomplete="name" required') +
    field('Email', 'email', 'email', 'autocomplete="username" required value="' + email + '"') +
    field('Choose a password', 'password', 'password', 'autocomplete="new-password" minlength="8" required') +
    '<button class="go" type="submit">Create account</button>' +
    '<div class="alinks"><button type="button" data-a="auth" data-k="in">I already have an account</button></div>');
  if (kind === 'forgot') return authPage('<h1>Reset your password</h1><p class="muted">We will email you a link to choose a new one.</p>' + msg +
    field('Email', 'email', 'email', 'autocomplete="username" required value="' + email + '"') +
    '<button class="go" type="submit">Send the link</button>' +
    '<div class="alinks"><button type="button" data-a="auth" data-k="in">Back to sign in</button></div>');
  if (kind === 'newpass') return authPage('<h1>Choose a new password</h1>' + msg +
    field('New password', 'password', 'password', 'autocomplete="new-password" minlength="8" required') +
    '<button class="go" type="submit">Save password</button>');
  if (kind === 'sent') return authPage('<h1>Check your email</h1><p class="muted">We sent a link to <b>' + email + '</b>. Open it to finish, then come back here and sign in.</p>' +
    '<div class="alinks"><button type="button" data-a="auth" data-k="in">Back to sign in</button></div>');
  if (kind === 'nolist') return authPage('<h1>You are not on the team list yet</h1><p class="muted">Ask a manager to add <b>' + email + '</b> under Team in Proview Jobs, then try again.</p>' +
    '<button class="go" type="button" data-a="retry">Try again</button>' +
    '<div class="alinks"><button type="button" data-a="signout">Use a different email</button></div>');
  return authPage('<h1>Cannot open Proview Jobs</h1><div class="notice bad">' + esc(o.err || 'Something went wrong.') + '</div><button class="go" type="button" data-a="reload">Try again</button>');
}

async function authSubmit(form) {
  const v = Object.fromEntries(new FormData(form).entries());
  const email = String(v.email || '').trim().toLowerCase();
  const btn = $('.go', form);
  const back = location.origin + location.pathname;
  busy(btn, true);
  try {
    if (S.auth === 'in') {
      if (!email || !v.password) return authScreen('in', { email, err: 'Enter your email and password.' });
      const { error } = await S.sb.auth.signInWithPassword({ email, password: v.password });
      if (error) {
        if (/not confirmed/i.test(error.message)) return authScreen('in', { email, err: 'Open the link we emailed you first, then sign in.' });
        return authScreen('in', { email, err: /invalid/i.test(error.message) ? 'That email or password is not right.' : problem(error) });
      }
      await enter();
    } else if (S.auth === 'up') {
      const name = String(v.name || '').trim();
      if (!name || !email) return authScreen('up', { email, err: 'Enter your name and email.' });
      if (String(v.password || '').length < 8) return authScreen('up', { email, err: 'Use a password of at least 8 characters.' });
      const { data, error } = await S.sb.auth.signUp({ email, password: v.password, options: { emailRedirectTo: back, data: { name } } });
      if (error) return authScreen('up', { email, err: problem(error) });
      if (data.user && data.user.identities && data.user.identities.length === 0) return authScreen('in', { email, note: 'That email already has an account. Sign in instead.' });
      if (data.session) await enter(); else authScreen('sent', { email });
    } else if (S.auth === 'forgot') {
      if (!email) return authScreen('forgot', { err: 'Enter your email.' });
      const { error } = await S.sb.auth.resetPasswordForEmail(email, { redirectTo: back });
      if (error) return authScreen('forgot', { email, err: problem(error) });
      authScreen('sent', { email });
    } else if (S.auth === 'newpass') {
      if (String(v.password || '').length < 8) return authScreen('newpass', { err: 'Use a password of at least 8 characters.' });
      const { error } = await S.sb.auth.updateUser({ password: v.password });
      if (error) return authScreen('newpass', { err: problem(error) });
      toast('Password saved');
      await enter();
    }
  } catch (e) {
    authScreen(S.auth, { email, err: problem(e) });
  } finally { busy(btn, false); }
}

/* After sign-in: find this person on the team list and open the app. */
async function enter() {
  let tz = null;
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (_) { /* optional */ }
  let me;
  try { me = await q(S.sb.rpc('pj_claim', { p_timezone: tz })); }
  catch (e) { return authScreen('fail', { err: problem(e) }); }
  if (!me || !me.id) {
    let email = '';
    try { email = (await S.sb.auth.getUser()).data.user.email; } catch (_) { /* shown blank */ }
    return authScreen('nolist', { email });
  }
  S.me = me;
  try {
    await Promise.all([loadJobs(), loadPeople(), loadSettings()]);
  } catch (e) { return authScreen('fail', { err: problem(e) }); }
  $('#login-root').innerHTML = '';
  $('#app').hidden = false;
  S.ready = true;
  S.tab = 'jobs'; S.filter = 'open';
  render();
  live();
}
async function signOut() {
  S.ready = false; S.me = null; S.job = null;
  $('#pnl-root').innerHTML = ''; closeModal();
  if (S.chan) { try { S.sb.removeChannel(S.chan); } catch (_) { /* gone already */ } S.chan = null; }
  try { await S.sb.auth.signOut(); } catch (_) { /* signed out locally anyway */ }
  authScreen('in');
}

/* ---- 30-jobs.js ---- */
/* The frame, the job list and the job page. */
const IC = {
  jobs: '<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4.5V3h6v1.5M9 10h6M9 14h6M9 18h3"/>',
  team: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.200a3.2 3.2 0 0 1 0 5.800M17.5 14.300c2.1.8 3.5 2.9 3.5 5.7"/>',
  chat: '<path d="M4 19.500l1.3-4A7.5 7.5 0 1 1 8.5 18.700z"/><path d="M9 10.500h6M9 13.500h3.5"/>',
  user: '<circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.500l4 4"/>',
  phone: '<path d="M6.5 3.500h3l1.5 4-2 1.500a11 11 0 0 0 5 5l1.5-2 4 1.500v3a2 2 0 0 1-2 2C10.5 18.5 5.5 13.5 4.5 5.500a2 2 0 0 1 2-2z"/>',
  pin: '<path d="M12 21s7-6.2 7-11.500a7 7 0 1 0-14 0C5 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  cal: '<rect x="4" y="5.5" width="16" height="15" rx="2.5"/><path d="M4 10h16M8.5 3.500v4M15.5 3.500v4"/>',
  bolt: '<path d="M13 3L5 13.500h6L10 21l8-10.500h-6z"/>',
  check: '<path d="M5 12.500l4.5 4.500L19 7.5"/>',
  play: '<path d="M8 5.500v13l10-6.500z"/>',
};
function ic(n) { return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + IC[n] + '</svg>'; }
function initial(name) { return esc((name || '?').trim().charAt(0).toUpperCase()); }
function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }

function render() {
  if (!S.ready) return;
  const mgr = isMgr();
  if (!mgr && S.tab !== 'me') S.tab = 'jobs';
  const titles = { jobs: mgr ? 'Jobs' : 'My jobs', team: 'Team', whatsapp: 'WhatsApp', me: 'Account' };
  $('#top').innerHTML = '<span class="pvlogo"></span><div class="tt"><small>' + greeting() + ', ' + esc(S.me.name.split(' ')[0]) + '</small><h1>' + titles[S.tab] + '</h1></div>' +
    '<button class="avatar" data-a="tab" data-k="me" aria-label="Account">' + initial(S.me.name) + '</button>';
  const tab = (k, l, i) => '<button data-a="tab" data-k="' + k + '" class="' + (S.tab === k ? 'on' : '') + '"' + (S.tab === k ? ' aria-current="page"' : '') + '>' + ic(i) + '<span>' + l + '</span></button>';
  $('#tabs').innerHTML = mgr
    ? tab('jobs', 'Jobs', 'jobs') + tab('team', 'Team', 'team') + '<button class="fab" data-a="job-new" aria-label="New job">' + ic('plus') + '</button>' + tab('whatsapp', 'WhatsApp', 'chat') + tab('me', 'Account', 'user')
    : tab('jobs', 'My jobs', 'jobs') + tab('me', 'Account', 'user');
  if (S.tab === 'team' && mgr) renderTeam();
  else if (S.tab === 'whatsapp' && mgr) renderWhatsApp();
  else if (S.tab === 'me') renderMe();
  else renderJobs();
}
function renderMe() {
  $('#main').innerHTML = '<div class="card me"><span class="avatar big">' + initial(S.me.name) + '</span><b>' + esc(S.me.name) + '</b><span class="mut">' + esc(S.me.email) + '</span><br><span class="pill ' + (isMgr() ? 'in_progress' : 'open') + '" style="margin-top:10px">' + (isMgr() ? 'Manager' : 'Staff') + '</span></div>' +
    '<div class="card"><h2>Put it on your home screen</h2><p class="mut">Open your browser menu and choose "Add to Home screen" (Android) or Share, then "Add to Home Screen" (iPhone). Proview Jobs then opens like any other app.</p></div>' +
    '<button class="btn bad wide" data-a="signout">Sign out</button>' +
    '<p style="text-align:center;margin-top:16px"><a href="privacy.html" target="_blank" rel="noopener" class="mut">Privacy policy</a></p>';
}

const isOpen = (j) => j.status === 'open' || j.status === 'in_progress';
const FILTERS = {
  open: isOpen,
  unassigned: (j) => !j.assigned_to && isOpen(j),
  late: (j) => isLate(j),
  done: (j) => j.status === 'done',
  all: () => true,
};
const FLABEL = { open: 'Open jobs', unassigned: 'Unassigned', late: 'Overdue', done: 'Done', all: 'All jobs' };
function sortJobs(a, b) {
  const ao = isOpen(a), bo = isOpen(b);
  if (ao !== bo) return ao ? -1 : 1;
  if (!ao) return (b.completed_at || b.updated_at || '').localeCompare(a.completed_at || a.updated_at || '');
  const ad = a.due_date || '9999', bd = b.due_date || '9999';
  if (ad !== bd) return ad < bd ? -1 : 1;
  if (PRANK[a.priority] !== PRANK[b.priority]) return PRANK[a.priority] - PRANK[b.priority];
  return (b.created_at || '').localeCompare(a.created_at || '');
}
function bucket(j) {
  if (!j.due_date) return 'No date';
  const t = todayISO();
  if (j.due_date < t) return 'Overdue';
  if (j.due_date === t) return 'Today';
  const diff = Math.round((new Date(j.due_date + 'T12:00:00') - new Date(t + 'T12:00:00')) / 86400000);
  return diff === 1 ? 'Tomorrow' : diff <= 7 ? 'This week' : 'Later';
}
function jobCard(j) {
  const tasks = j.pj_job_tasks || [], done = tasks.filter((t) => t.done).length;
  const who = j.assigned_to ? (j.assigned_to === S.me.id ? 'You' : personName(j.assigned_to) || 'Someone') : '';
  const sub = [j.customer_name, j.address].filter(Boolean).join(' · ');
  return '<button class="job p-' + j.priority + ' s-' + j.status + '" data-a="open" data-id="' + j.id + '">' +
    '<span class="r1"><span class="ref">' + jref(j) + '</span>' +
    (j.priority !== 'normal' ? '<span class="pill ' + j.priority + '">' + PRIORITY[j.priority] + '</span>' : '') +
    '<span class="pill ' + j.status + '">' + STATUS[j.status] + '</span>' +
    (isMgr() && j.source === 'whatsapp' ? '<span class="pill wa">WhatsApp</span>' : '') + '</span>' +
    '<span class="t">' + esc(j.title) + '</span>' +
    (sub ? '<span class="m">' + esc(sub) + '</span>' : '') +
    '<span class="f">' +
    (isMgr() ? (who ? '<span><span class="avatar sm">' + initial(who) + '</span><b>' + esc(who) + '</b></span>' : (isOpen(j) ? '<span><span class="avatar sm none">?</span><b class="late" style="color:var(--warn)!important">Unassigned</b></span>' : '')) : '') +
    (j.due_date ? '<span class="' + (isLate(j) ? 'late' : '') + '">' + ic('cal') + '<b' + (isLate(j) ? ' class="late"' : '') + '>' + niceDate(j.due_date) + '</b></span>' : '') +
    (tasks.length ? '<span>' + ic('check') + '<b>' + done + '/' + tasks.length + '</b><span class="bar"><i style="width:' + Math.round(done / tasks.length * 100) + '%"></i></span></span>' : '') +
    '</span></button>';
}
function renderJobs() {
  const mgr = isMgr();
  const count = (k) => S.jobs.filter(FILTERS[k]).length;
  const tiles = mgr ? [['open', 'Open'], ['unassigned', 'Unassigned'], ['late', 'Overdue'], ['done', 'Done']] : [['open', 'To do'], ['late', 'Overdue'], ['done', 'Done']];
  if (S.filter !== 'all' && !tiles.some((c) => c[0] === S.filter)) S.filter = 'open';
  const term = S.q.trim().toLowerCase();
  let list = S.jobs.filter(FILTERS[S.filter]);
  if (term) list = list.filter((j) => [jref(j), j.title, j.customer_name, j.customer_phone, j.address, j.description, personName(j.assigned_to)].join(' ').toLowerCase().includes(term));
  list.sort(sortJobs);
  const empty = term ? ['Nothing matches', 'Try a different search.']
    : S.filter === 'open' ? (mgr ? ['No open jobs', 'Tap + to create one, or send a WhatsApp message that starts with Job.'] : ['Nothing to do right now', 'Jobs your manager assigns to you appear here.'])
    : ['Nothing here', ''];
  let body = '';
  if (!list.length) body = '<div class="empty">' + ic('jobs') + '<b>' + empty[0] + '</b>' + empty[1] + '</div>';
  else if (S.filter === 'done' || S.filter === 'all') body = '<div class="list">' + list.map(jobCard).join('') + '</div>';
  else {
    // grouped by when they are due, the way a to-do app shows a day
    const order = ['Overdue', 'Today', 'Tomorrow', 'This week', 'Later', 'No date'];
    const groups = {};
    for (const j of list) (groups[bucket(j)] = groups[bucket(j)] || []).push(j);
    body = order.filter((g) => groups[g]).map((g) => '<div class="grp' + (g === 'Overdue' ? ' late' : '') + '">' + g + '<i>' + groups[g].length + '</i></div><div class="list">' + groups[g].map(jobCard).join('') + '</div>').join('');
  }
  const hadFocus = document.activeElement && document.activeElement.id === 'search';
  $('#main').innerHTML =
    '<div class="stats n' + tiles.length + '">' + tiles.map(([k, l]) => { const n = count(k); return '<button class="stat k-' + k + (S.filter === k ? ' on' : '') + (n ? '' : ' zero') + '" data-a="filter" data-k="' + k + '"' + (S.filter === k ? ' aria-pressed="true"' : '') + '><b>' + n + '</b><span>' + l + '</span></button>'; }).join('') + '</div>' +
    '<div class="lh"><h2>' + (mgr ? FLABEL[S.filter] : S.filter === 'open' ? 'To do' : FLABEL[S.filter]) + '<small class="mut">' + list.length + '</small></h2>' +
    (mgr ? '<button class="lnk" data-a="quick">' + ic('bolt') + 'Quick add</button>' : '') +
    '<button class="lnk" data-a="filter" data-k="' + (S.filter === 'all' ? 'open' : 'all') + '">' + (S.filter === 'all' ? 'Open only' : 'All') + '</button></div>' +
    (S.jobs.length > 3 || term ? '<input class="search" id="search" type="search" placeholder="Search jobs" value="' + esc(S.q) + '" aria-label="Search jobs">' : '') + body;
  if (hadFocus) { const s = $('#search'); if (s) { s.focus(); s.setSelectionRange(s.value.length, s.value.length); } }
}

async function jobProgress(status, notes) {
  const j = S.job; if (!j) return;
  try {
    await q(S.sb.rpc('pj_job_progress', { p_job: j.id, p_status: status, p_notes: notes == null ? null : notes }));
    toast(status === 'done' ? 'Job marked as done' : status === 'in_progress' ? 'Job started' : 'Saved');

  } catch (e) { toast(problem(e), true); }

function finishJob() {
  const j = S.job; if (!j) return;
  const left = j.pj_job_tasks.filter((t) => !t.done).length;
  const notes = $('#notes') ? $('#notes').value : j.completion_notes;
  modal('<h2>Mark ' + jref(j) + ' as done?</h2>' +
    (left ? '<div class="err">' + left + (left === 1 ? ' task is' : ' tasks are') + ' not ticked yet.</div>' : '') +

async function toggleCheck(el) {
  const j = S.job; if (!j) return;
  const isTask = el.dataset.c === 'task';
  try {
    if (isTask) await q(S.sb.rpc('pj_task_done', { p_task: el.dataset.id, p_done: el.checked }));
    else await q(S.sb.rpc('pj_part_used', { p_part: el.dataset.id, p_used: el.checked }));
    const row = (isTask ? j.pj_job_tasks : j.pj_job_parts).find((x) => x.id === el.dataset.id);
    if (row) row[isTask ? 'done' : 'used'] = el.checked;
    renderJob();
    loadJobs().then(() => { if (S.tab === 'jobs') renderJobs(); }).catch(() => {});
  } catch (e) { el.checked = !el.checked; toast(problem(e), true); }
}
async function addPhotos(files) {
  const j = S.job; if (!j || !files.length) return;
  toast('Uploading ' + files.length + (files.length === 1 ? ' photo' : ' photos'));
  let okCount = 0;
  for (const file of files) {
    try {
      const blob = await shrink(file);
      const type = blob.type || 'image/jpeg';
      const ext = type === 'image/png' ? 'png' : type === 'image/webp' ? 'webp' : 'jpg';
      const path = j.id + '/' + uuid() + '.' + ext;
      const up = await S.sb.storage.from('job-photos').upload(path, blob, { contentType: type, upsert: false });
      if (up.error) throw up.error;
      await q(S.sb.from('pj_job_photos').insert({ job_id: j.id, path, uploaded_by: S.me.id }));
      okCount++;
    } catch (e) { toast('A photo could not be added: ' + problem(e), true); }
  }
  if (okCount) { toast(okCount + (okCount === 1 ? ' photo added' : ' photos added')); await openJob(j.id, true); }
}
async function removePhoto(id) {
  const j = S.job; if (!j) return;
  const p = j.pj_job_photos.find((x) => x.id === id); if (!p) return;
  try {
    await q(S.sb.from('pj_job_photos').delete().eq('id', id));
    if (isMgr()) await S.sb.storage.from('job-photos').remove([p.path]);
    await openJob(j.id, true);
  } catch (e) { toast(problem(e), true); }
}

  const v = Object.fromEntries(new FormData(form).entries());
  const id = form.dataset.id || null, me = id === S.me.id;
  const err = (m) => { $('#form-err').innerHTML = '<div class="err">' + esc(m) + '</div>'; };
  const name = String(v.name || '').trim(), email = String(v.email || '').trim().toLowerCase(), phone = digits(v.phone);
  if (!name) return err('Enter their name.');
  if (!/^\S+@\S+\.\S+$/.test(email)) return err('Enter a valid email.');
  if (phone && (phone.length < 7 || phone.length > 15)) return err('Enter the WhatsApp number in full with the country code, for example 971501234567.');
  if (phone && phone.startsWith('0')) return err('Start the WhatsApp number with the country code, not 0. For example 971501234567 or 447700900123.');
  const row = { name, email, phone: phone || null };
  if (!me) { row.role = v.role === 'manager' ? 'manager' : 'staff'; if (id) row.active = !!v.active; }
  const btn = $('[type=submit]', form); busy(btn, true);
  try {
    if (id) await q(S.sb.from('pj_people').update(row).eq('id', id));
    else await q(S.sb.from('pj_people').insert(row));
    closeModal(); toast(id ? 'Saved' : name + ' added');
    await loadPeople(); if (me) S.me = person(S.me.id) || S.me;
    render();
  } catch (e) { err(/duplicate|unique/i.test(problem(e)) ? 'Someone with that email is already on the team.' : problem(e)); } finally { busy(btn, false); }
}

/* ---------- WhatsApp ---------- */
function renderWhatsApp() {
  const hook = S.cfg.url + '/functions/v1/whatsapp-webhook';
  let zones = [];
  try { zones = Intl.supportedValuesOf('timeZone'); } catch (_) { zones = []; }
  if (!zones.includes(S.settings.timezone)) zones.unshift(S.settings.timezone);
  $('#main').innerHTML = '' +
    '<div class="card"><h2>How to write a job</h2>' +
    '<label class="ck"><input type="checkbox" id="wa-any"' + (S.settings.wa_any_message ? ' checked' : '') + '><span><b>Every message is a job</b><br><small>Any message typed or forwarded to the jobs line from an approved number creates a job. Turn off to require the word Job at the start.</small></span></label>' +
    '<p style="margin-top:10px">The first line becomes the job. Add any of the other lines you want, or just write notes. Short replies like "ok" or "thanks" are ignored.</p>' +
    '<pre class="code" id="example">' + esc(EXAMPLE) + '</pre><button class="btn sm" data-a="copy" data-t="example">Copy example</button></div>' +
    '<div class="card"><h2>Numbers <small class="mut">who can create jobs, and who is sent them</small></h2><div id="wa-numbers">' + waNumbers() + '</div>' +
    '<button class="btn sm" data-a="number-new">' + ic('plus') + 'Add a number</button>' +
    '<p class="mut" style="margin-top:10px">Managers can also create jobs from the WhatsApp number on their profile. Whoever a job is assigned to is sent it on the number on their profile.</p></div>' +
    '<div class="card"><h2>Dates</h2><label class="fld">"Today" and "tomorrow" in messages use this time zone<select id="tz">' + zones.map((z) => '<option' + (z === S.settings.timezone ? ' selected' : '') + '>' + esc(z) + '</option>').join('') + '</select></label></div>' +
    '<div class="card"><h2>Connection</h2><p>In your Meta app, under WhatsApp, Configuration, set this as the Callback URL, enter your verify phrase, and subscribe to <b>messages</b>.</p>' +
    '<div class="copy"><code id="hook">' + esc(hook) + '</code><button class="btn sm" data-a="copy" data-t="hook">Copy</button></div></div>' +
    '<div class="card"><h2>Recent job messages</h2><div id="wa-log">' + waLog() + '</div></div>';
  loadWa().then(() => { const el = $('#wa-log'); if (el) el.innerHTML = waLog(); }).catch(() => {});
  loadNumbers().then(() => { const el = $('#wa-numbers'); if (el) el.innerHTML = waNumbers(); }).catch(() => {});
}
function waLog() {
  if (!S.wa.length) return '<p class="mut">Nothing yet. Job messages show here with what happened to them.</p>';
  return S.wa.map((w) => '<div class="log"><div class="h"><b>' + esc(w.result || 'Received') + '</b><span>' + niceTime(w.created_at) + '</span><span>' + (w.source === 'quick' ? 'Quick add' : w.from_phone ? '+' + esc(w.from_phone) : '') + '</span></div><div class="pre mut">' + esc(String(w.body || '').slice(0, 300)) + '</div></div>').join('');
}
function waNumbers() {
  if (!S.numbers.length) return '<p class="mut">No numbers yet.</p>';
  return S.numbers.map((n) => '<button class="person" data-a="number" data-id="' + esc(n.phone) + '" style="margin-bottom:8px"><span class="avatar' + (n.can_create || n.notify ? '' : ' none') + '">' + ic('chat') + '</span>' +
    '<span class="nm"><b>+' + esc(n.phone) + '</b><small>' + esc(n.label || 'No name') + '</small></span>' +
    (n.can_create ? '<span class="pill in_progress">Creates</span>' : '') + (n.notify ? '<span class="pill done">Receives</span>' : '') + (!n.can_create && !n.notify ? '<span class="pill cancelled">Off</span>' : '') + '</button>').join('');
}
function numberForm(n) {
  const isNew = !n; n = n || { can_create: true, notify: true };
  modal('<form id="number-form" novalidate data-id="' + esc(n.phone || '') + '"><h2>' + (isNew ? 'Add a number' : '+' + esc(n.phone)) + '</h2><div id="form-err"></div>' +
    (isNew ? '<label class="fld">WhatsApp number, with country code<input name="phone" type="tel" inputmode="tel" placeholder="447700900123" autofocus autocomplete="off"></label>' : '') +
    '<label class="fld">Name for this number<input name="label" value="' + esc(n.label || '') + '" placeholder="Office line" autocomplete="off"></label>' +
    '<label class="ck"><input type="checkbox" name="can_create"' + (n.can_create ? ' checked' : '') + '><span>Can create jobs by sending a message that starts with Job</span></label>' +
    '<label class="ck"><input type="checkbox" name="notify"' + (n.notify ? ' checked' : '') + '><span>Is sent every new job on WhatsApp</span></label>' +
    '<div class="foot">' + (isNew ? '' : '<button type="button" class="btn bad sp" data-a="number-del" data-id="' + esc(n.phone) + '">Remove</button>') +
    '<button type="button" class="btn" data-a="mdl-close">Cancel</button><button class="btn pri" type="submit">' + (isNew ? 'Add' : 'Save') + '</button></div></form>');
}
async function saveNumber(form) {
  const v = Object.fromEntries(new FormData(form).entries());
  const id = form.dataset.id || null;
  const err = (m) => { $('#form-err').innerHTML = '<div class="err">' + esc(m) + '</div>'; };
  const row = { label: String(v.label || '').trim(), can_create: !!v.can_create, notify: !!v.notify };
  if (!id) {
    const phone = digits(v.phone);
    if (phone.length < 7 || phone.length > 15) return err('Enter the number in full with the country code, for example 447700900123.');
    if (phone.startsWith('0')) return err('Start with the country code, not 0. For a UK number, replace the first 0 with 44.');
    row.phone = phone;
  }
  const btn = $('[type=submit]', form); busy(btn, true);
  try {
    if (id) await q(S.sb.from('pj_wa_numbers').update(row).eq('phone', id));
    else await q(S.sb.from('pj_wa_numbers').insert(row));
    closeModal(); toast('Saved'); await loadNumbers(); if (S.tab === 'whatsapp') renderWhatsApp();
  } catch (e) { err(/duplicate|unique/i.test(problem(e)) ? 'That number is already on the list.' : problem(e)); } finally { busy(btn, false); }
}

/* ---- 99-boot.js ---- */
/* Clicks, live updates and start-up. */
document.addEventListener('click', async (ev) => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'mdl-bg') { if (ev.target === el) closeModal(); return; }
  if (a === 'photo-rm') { ev.preventDefault(); ev.stopPropagation(); const id = el.dataset.id; return confirmBox('Remove this photo?', 'It will be removed from the job.', 'Remove', () => removePhoto(id), true); }
  if (a === 'auth') return authScreen(el.dataset.k);
  if (a === 'retry') return enter();
  if (a === 'reload') return location.reload();
  if (a === 'signout') return signOut();
  if (a === 'tab') { S.tab = el.dataset.k; closeJob(); return render(); }
  if (a === 'filter') { S.filter = el.dataset.k; return renderJobs(); }
  if (a === 'open') return openJob(el.dataset.id);
  if (a === 'back') return closeJob();
  if (a === 'mdl-close') return closeModal();
  if (a === 'confirm-yes') { const fn = S.confirm; closeModal(); return fn && fn(); }
  if (a === 'progress') return jobProgress(el.dataset.k, $('#notes') ? $('#notes').value : null);
  if (a === 'finish') return finishJob();
  if (a === 'finish-yes') { const n = $('#fin-notes').value; closeModal(); return jobProgress('done', n); }
  if (a === 'notes-save') return jobProgress(S.job.status, $('#notes').value);
  if (a === 'copy') return copyText($('#' + el.dataset.t).textContent);
  if (!isMgr()) return;
  if (a === 'job-new') return jobForm();
  if (a === 'job-edit') return jobForm(S.job);
  if (a === 'quick') return quickForm();
  if (a === 'row-add') return addRow(el.dataset.k);
  if (a === 'row-rm') return el.closest('.rw').remove();
  if (a === 'job-del') { const j = S.job; return confirmBox('Delete ' + jref(j) + '?', 'The job, its tasks, parts and photos will be removed for good.', 'Delete job', async () => {
    try {
      const paths = j.pj_job_photos.map((p) => p.path);
      await q(S.sb.from('pj_jobs').delete().eq('id', j.id));
      if (paths.length) await S.sb.storage.from('job-photos').remove(paths);
      closeJob(); toast('Job deleted'); await refresh();
    } catch (e) { toast(problem(e), true); }
  }, true); }
  if (a === 'number-new') return numberForm();
  if (a === 'number') return numberForm(S.numbers.find((n) => n.phone === el.dataset.id));
  if (a === 'number-del') { const ph = el.dataset.id; return confirmBox('Remove +' + ph + '?', 'It will no longer be able to create jobs or be sent them.', 'Remove', async () => {
    try { await q(S.sb.from('pj_wa_numbers').delete().eq('phone', ph)); toast('Removed'); await loadNumbers(); if (S.tab === 'whatsapp') renderWhatsApp(); }
    catch (e) { toast(problem(e), true); }
  }, true); }
  if (a === 'person-new') return personForm();
  if (a === 'person') return personForm(person(el.dataset.id));
  if (a === 'person-del') { const p = person(el.dataset.id); return confirmBox('Remove ' + p.name + '?', 'They will no longer be able to sign in. Jobs assigned to them become unassigned.', 'Remove', async () => {
    try { await q(S.sb.from('pj_people').delete().eq('id', p.id)); toast(p.name + ' removed'); await Promise.all([loadPeople(), loadJobs()]); render(); }
    catch (e) { toast(problem(e), true); }
  }, true); }
});
document.addEventListener('submit', (ev) => {
  ev.preventDefault();
  const f = ev.target;
  if (f.id === 'auth-form') return authSubmit(f);
  if (!isMgr()) return;
  if (f.id === 'job-form') return saveJob(f);
  if (f.id === 'quick-form') return saveQuick(f);
  if (f.id === 'person-form') return savePerson(f);
  if (f.id === 'number-form') return saveNumber(f);
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.c) return toggleCheck(el);
  if (el.id === 'photo-in') { const files = [...el.files]; el.value = ''; return addPhotos(files); }
  if (!isMgr()) return;
  if (el.id === 'assign') { const jid = S.job.id, to = el.value; return managerSet({ assigned_to: to || null }, to ? 'Assigned to ' + personName(to) : 'Unassigned').then(() => { if (to) sendNotices(jid, true); }); }
  if (el.id === 'status') return managerSet({ status: el.value }, 'Status: ' + STATUS[el.value]);
  if (el.id === 'wa-any') { const on = el.checked; return q(S.sb.from('pj_settings').update({ wa_any_message: on }).eq('id', true)).then(() => { S.settings.wa_any_message = on; toast(on ? 'Every message is now a job' : 'Messages must start with Job'); }).catch((e) => { el.checked = !on; toast(problem(e), true); }); }
  if (el.id === 'tz') return q(S.sb.from('pj_settings').update({ timezone: el.value }).eq('id', true)).then(() => { S.settings.timezone = el.value; toast('Time zone saved'); }).catch((e) => toast(problem(e), true));
});
document.addEventListener('input', (ev) => {
  if (ev.target.id === 'search') { S.q = ev.target.value; renderJobs(); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { if ($('#mdl-root').innerHTML) closeModal(); else if (S.job) closeJob(); return; }
  // Enter in a task or part line starts the next line instead of saving the form
  if (ev.key === 'Enter' && ev.target.closest && ev.target.closest('.rows')) {
    ev.preventDefault();
    addRow(ev.target.closest('#task-rows') ? 'task' : 'part');
  }
});

/* Live updates: a job created on WhatsApp, or assigned to you, appears without reloading. */
function live() {
  if (S.chan || !S.sb.channel) return;
  let timer = null;
  const changed = (payload) => {
    const known = new Set(S.jobs.map((j) => j.id));
    clearTimeout(timer);
    timer = setTimeout(async () => {
      if (!S.ready) return;
      try {
        await loadJobs();
        if (S.tab === 'jobs') renderJobs();
        if (payload && payload.table === 'pj_jobs' && payload.new && payload.new.id && !known.has(payload.new.id) && S.jobs.some((j) => j.id === payload.new.id)) {
          toast(isMgr() ? 'New job: ' + payload.new.title : 'New job for you: ' + payload.new.title);
        }
        const typing = document.activeElement && document.activeElement.id === 'notes';
        if (S.job && !typing && !$('#mdl-root').innerHTML) await openJob(S.job.id, true);
      } catch (_) { /* the next change will try again */ }
    }, 500);
  };
  let ch = S.sb.channel('pj-live');
  for (const table of ['pj_jobs', 'pj_job_tasks', 'pj_job_parts', 'pj_job_photos']) ch = ch.on('postgres_changes', { event: '*', schema: 'public', table }, changed);
  S.chan = ch.subscribe();
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.ready) changed(null); });
}

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
}
(async function boot() {
  try {
    S.cfg = await (await fetch('cloud.json', { cache: 'no-store' })).json();
    if (window.__PJ_SB__) S.sb = window.__PJ_SB__;           // stand-in used by the tests
    else {
      if (!window.supabase) await loadScript(SDK);
      S.sb = window.supabase.createClient(S.cfg.url, S.cfg.key, { auth: { persistSession: true, autoRefreshToken: true } });
    }
  } catch (e) { return authScreen('fail', { err: 'Cannot reach the sign-in service. Check the internet.' }); }
  let recovering = /type=recovery/.test(location.hash);
  S.sb.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') { recovering = true; setTimeout(() => authScreen('newpass'), 0); }
    if (event === 'SIGNED_OUT' && S.ready) setTimeout(signOut, 0);
  });
  try {
    const { data } = await S.sb.auth.getSession();
    if (recovering) return authScreen('newpass');
    if (data && data.session) await enter(); else authScreen('in');
  } catch (e) { authScreen('in'); }
})();
